name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# AAX is not built here: the Avid AAX SDK is not redistributable. See README.md.
# Both plugins are built, tested, validated and packaged here (zips for TriPan and DistPan).

env:
  PLUGINVAL_VERSION: v1.0.4

jobs:
  macos:
    runs-on: macos-latest
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (universal binary)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DTLOS_INSTALL_VST3=OFF -DTLOS_INSTALL_AU=OFF

      - name: Build
        run: >
          cmake --build build --config Release
          --target TriPan_VST3 TriPan_AU TriPan_Standalone DistPan_VST3 DistPan_AU DistPan_Standalone
          TlosCoreTests TlosExchangeTests TriPanCoreTests TriPanExchangeTests TriPanProcessorTests TriPanEditorTests
          DistPanCoreTests DistPanProcessorTests DistPanEditorTests

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate VST3 with pluginval
        run: |
          curl -sSfL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --timeout-ms 120000 \
            build/TriPan/TriPan_artefacts/Release/VST3/TriPan.vst3
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --timeout-ms 120000 \
            build/DistPan/DistPan_artefacts/Release/VST3/DistPan.vst3

      # Signing and notarization run only when the repository has the signing secrets
      # (see README.md, "Signing and notarization"). Otherwise unsigned zips are produced.
      - name: Sign and notarize
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          for plugin in TriPan DistPan; do
            PLUGIN=$plugin NO_BUILD=1 BUILD_DIR=build scripts/sign-and-notarize.sh
          done
          security delete-keychain "$KEYCHAIN"

      - name: Package (unsigned)
        if: env.HAS_SIGNING != 'true'
        run: |
          mkdir -p dist
          for plugin in TriPan DistPan; do
            art="build/$plugin/${plugin}_artefacts/Release"
            ditto -c -k --keepParent "$art/VST3/$plugin.vst3" "dist/$plugin-macOS-VST3.zip"
            ditto -c -k --keepParent "$art/AU/$plugin.component" "dist/$plugin-macOS-AU.zip"
            ditto -c -k --keepParent "$art/Standalone/$plugin.app" "dist/$plugin-macOS-Standalone.zip"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macOS
          path: dist/*.zip

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: >
          cmake --build build --config Release --parallel
          --target TriPan_VST3 TriPan_Standalone DistPan_VST3 DistPan_Standalone
          TlosCoreTests TlosExchangeTests TriPanCoreTests TriPanExchangeTests TriPanProcessorTests TriPanEditorTests
          DistPanCoreTests DistPanProcessorTests DistPanEditorTests

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate VST3 with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/$env:PLUGINVAL_VERSION/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 10 --timeout-ms 120000 build/TriPan/TriPan_artefacts/Release/VST3/TriPan.vst3
          ./pluginval/pluginval.exe --strictness-level 10 --timeout-ms 120000 build/DistPan/DistPan_artefacts/Release/VST3/DistPan.vst3

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($plugin in "TriPan", "DistPan") {
            $art = "build/$plugin/${plugin}_artefacts/Release"
            Compress-Archive -Path "$art/VST3/$plugin.vst3" -DestinationPath "dist/$plugin-Windows-VST3.zip"
            Compress-Archive -Path "$art/Standalone/$plugin.exe" -DestinationPath "dist/$plugin-Windows-Standalone.zip"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: dist/*.zip

  release:
    # Publishes a GitHub release with the zips when a version tag (v*) is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
